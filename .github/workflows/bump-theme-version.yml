name: Bump Zendesk Theme Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Increment theme patch version
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "manifest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));

          const match = manifest.version.match(/^(\d+)\.(\d+)\.(\d+)$/);

          if (!match) {
            throw new Error("Invalid semantic version: " + manifest.version);
          }

          const major = Number(match[1]);
          const minor = Number(match[2]);
          const patch = Number(match[3]) + 1;

          manifest.version = `${major}.${minor}.${patch}`;

          fs.writeFileSync(
            path,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log("New version:", manifest.version);
          NODE

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump Zendesk theme version"
          git push
